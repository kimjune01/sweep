[project]
name = "sweep"
version = "0.1.0"
description = "Temporal-supervised PR pipeline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.102.0",
    "psutil>=7.2.2",
    "temporalio>=1.27.2",
    "typer>=0.25.1",
]

[project.scripts]
sweep = "sweep.client:app"
sweep-worker = "sweep.worker:main"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = ""
